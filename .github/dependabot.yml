# Keeps the GitHub Actions used by the checks up to date (pinned to commit
# SHAs; Dependabot moves SHA and version comment together). The apps' own
# dependencies live in their application repositories, each with its own
# Dependabot configuration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
