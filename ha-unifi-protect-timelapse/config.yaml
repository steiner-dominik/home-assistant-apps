name: "UniFi Protect Timelapse"
description: "Timelapse capture and archive watchdog for a UniFi Protect camera: live view, archive browser with gap detection, video export and health monitoring"
version: "26.09.05"
slug: "unifi_protect_timelapse"
url: "https://github.com/steiner-dominik/unifi-protect-timelapse"
# Prebuilt multi-arch image, published from the application source repo
# (https://github.com/steiner-dominik/unifi-protect-timelapse). The Supervisor
# pulls <image>:<version>, so this app's version must match a published image
# tag.
image: "ghcr.io/steiner-dominik/unifi-protect-timelapse"
init: false
ingress: true
ingress_port: 8080
# Lets the app write its own entities to the Core API with the Supervisor
# token, so camera and archive health show up in Home Assistant without MQTT or
# template sensors.
homeassistant_api: true
panel_icon: mdi:camera-timer
panel_title: Timelapse
watchdog: http://[HOST]:[PORT:8080]/healthz
arch:
  - aarch64
  - amd64
  - armv7
# The archive is read through Home Assistant's own network storage
# (Settings -> System -> Storage), which surfaces under /media or /share.
# Writable so capturing can be switched on; the defaults below only read.
map:
  - media:rw
  - share:rw
options:
  archive_path: "/media/timelapse"
  camera_source: "snapshot"
  camera_fallback_source: ""
  camera_snapshot_url: ""
  protect_host: ""
  protect_api_key: ""
  protect_camera_id: ""
  camera_insecure_tls: false
  capture_enabled: false
  sync_mode: "off"
  auth_mode: "ingress"
  capture_interval: "5m"
  filename_prefix: "snapshot_"
  active_hours: "05-21"
  monitor_enabled: true
  monitor_interval: "5m"
  archive_max_age: ""
  frozen_frame_threshold: 3
  video_enabled: true
  video_fps: 12
  entity_prefix: "timelapse"
  language: "en"
  log_level: "info"
schema:
  archive_path: str
  camera_source: list(protect|snapshot)
  camera_fallback_source: list(|protect|snapshot)?
  camera_snapshot_url: str?
  protect_host: str?
  protect_api_key: password?
  protect_camera_id: str?
  camera_insecure_tls: bool
  capture_enabled: bool
  sync_mode: list(off|opportunistic|nightly)
  auth_mode: list(ingress|local)
  capture_interval: str
  filename_prefix: str
  active_hours: match(^([01]?[0-9]|2[0-3])-([01]?[0-9]|2[0-3])$)
  monitor_enabled: bool
  monitor_interval: str
  archive_max_age: str?
  frozen_frame_threshold: int(0,100)
  video_enabled: bool
  video_fps: int(1,120)
  entity_prefix: str
  language: list(en|de)
  log_level: list(debug|info|warn|error)
