configuration:
  refresh_token:
    name: Refresh token
    description: >-
      Tesla refresh token, generated with one of the token apps listed in the
      documentation. Access tokens are obtained and renewed automatically —
      this is the only credential the app needs.
  polling_interval:
    name: Polling interval
    description: How often (in minutes) to check for new invoices.
  default_currency:
    name: Default currency
    description: >-
      Three-letter currency code (e.g. EUR, USD) preferred in the dashboard
      when invoices exist in several currencies. Leave empty to auto-detect.
      Costs are never converted between currencies.
  enable_email_export:
    name: Enable email export
    description: >-
      Send every newly downloaded invoice as an email attachment. Invoices
      synced while this was disabled are never sent automatically (no mail
      flood after enabling) — send them combined via Maintenance → Email
      backlog in the web UI.
  enable_subscription_invoice:
    name: Download subscription invoices
    description: Also download subscription (e.g. Premium Connectivity) invoices.
  email:
    name: Email settings
    description: >-
      SMTP settings for email export (from, to, mailserver, port, user,
      password). Required if email export is enabled.
