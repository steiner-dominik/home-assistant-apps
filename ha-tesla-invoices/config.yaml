name: "Tesla Invoices"
description: "Download Tesla charging and subscription invoices, with analytics dashboard and email export"
version: "2026.07.01"
slug: "tesla_invoices"
url: "https://github.com/steiner-dominik/home-assistant-apps"
# Prebuilt multi-arch image, published from the application source repo
# (https://github.com/steiner-dominik/tesla-invoices). The Supervisor pulls
# <image>:<version>, so this app's version must match a published image tag.
image: "ghcr.io/steiner-dominik/tesla-invoices"
init: false
ingress: true
ingress_port: 9000
panel_icon: mdi:file-document-multiple
panel_title: Tesla Invoices
watchdog: http://[HOST]:[PORT:9000]/health
# curl_cffi (needed for the token refresh) only ships musl wheels for these
arch:
  - aarch64
  - amd64
options:
  access_token: ""
  refresh_token: ""
  polling_interval: 15
  default_currency: ""
  enable_email_export: false
  enable_subscription_invoice: true
  email:
    from: "sender_mail@example.com"
    to: "receiver_mail@example.com"
    mailserver: "mailserver.example.com"
    port: 587
    user: ""
    password: ""
schema:
  access_token: password
  refresh_token: password
  polling_interval: int(1,1440)
  default_currency: match(^([A-Za-z]{3})?$)?
  enable_email_export: bool
  enable_subscription_invoice: bool
  email:
    from: email?
    to: email?
    mailserver: str?
    port: int?
    user: str?
    password: password?
